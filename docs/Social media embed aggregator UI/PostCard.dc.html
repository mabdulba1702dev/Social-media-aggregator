<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-e70b4432-9de9-4106-8989-9c2001eedd97/styles.css">
<script src="_ds/modernist-e70b4432-9de9-4106-8989-9c2001eedd97/_ds_bundle.js"></script>
</helmet>
<div style="{{ post.cardStyle }}" onClick="{{ post.open }}" style-hover="border-color:var(--color-text)">
  <div style="{{ post.mediaStyle }}">
    {{ imgNode }}

    <sc-if value="{{ post.selectMode }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ handleSelect }}" style="{{ post.checkStyle }}">
        <sc-if value="{{ post.selected }}" hint-placeholder-val="{{ false }}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </sc-if>
      </button>
    </sc-if>

    <sc-if value="{{ post.isVideo }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;top:0;left:0;background:var(--color-text);color:var(--color-bg);padding:4px 8px;display:flex;align-items:center;gap:5px;font-family:var(--font-heading);font-weight:800;font-size:10px;letter-spacing:.1em;text-transform:uppercase">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5v14l11-7z"/></svg>
        Video
      </div>
    </sc-if>
    <sc-if value="{{ post.isCarousel }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;top:0;left:0;background:var(--color-text);color:var(--color-bg);padding:4px 8px;display:flex;align-items:center;gap:5px;font-family:var(--font-heading);font-weight:800;font-size:10px;letter-spacing:.1em;text-transform:uppercase">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        {{ post.carouselCount }}
      </div>
    </sc-if>
    <sc-if value="{{ post.isArticle }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;top:0;left:0;background:var(--color-text);color:var(--color-bg);padding:4px 8px;display:flex;align-items:center;gap:5px;font-family:var(--font-heading);font-weight:800;font-size:10px;letter-spacing:.1em;text-transform:uppercase">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Link
      </div>
    </sc-if>

    <div style="position:absolute;inset:0;opacity:0;transition:opacity .18s ease;background:linear-gradient(to top, rgba(32,30,29,.78), transparent 58%);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;gap:8px" style-hover="opacity:1">
      <div style="display:flex;gap:6px">
        <button onClick="{{ stopMenuClick }}" style="flex:1;background:var(--color-bg);color:var(--color-text);border:none;cursor:pointer;padding:7px 0;font-family:var(--font-heading);font-weight:800;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;transition:background-color .15s ease" style-hover="background:var(--color-accent);color:var(--color-bg)">Save</button>
        <button onClick="{{ toggleMenu }}" style="width:30px;flex:none;background:var(--color-bg);color:var(--color-text);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background-color .15s ease" style-hover="background:var(--color-neutral-200)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="4" y="11" width="2.4" height="2.4"/><rect x="10.8" y="11" width="2.4" height="2.4"/><rect x="17.6" y="11" width="2.4" height="2.4"/></svg>
        </button>
      </div>
    </div>
  </div>

  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ stopMenuClick }}" style="position:absolute;top:8px;right:8px;background:var(--color-bg);border:2px solid var(--color-text);z-index:6;min-width:158px;display:flex;flex-direction:column;box-shadow:var(--shadow-md)">
      <button onClick="{{ stopMenuClick }}" style="border:none;background:none;text-align:left;cursor:pointer;padding:9px 12px;font-size:12.5px;color:var(--color-text);display:flex;align-items:center;gap:8px;font-family:var(--font-body)" style-hover="background:var(--color-neutral-200)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Open original
      </button>
      <button onClick="{{ handleCopyLink }}" style="border:none;background:none;text-align:left;cursor:pointer;padding:9px 12px;font-size:12.5px;color:var(--color-text);display:flex;align-items:center;gap:8px;font-family:var(--font-body)" style-hover="background:var(--color-neutral-200)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.07 0l1.93-1.93a5 5 0 00-7.07-7.07L10.5 5.5"/><path d="M14 11a5 5 0 00-7.07 0L5 12.93a5 5 0 007.07 7.07L13.5 18.5"/></svg>
        Copy link
      </button>
      <div style="height:2px;background:var(--color-divider)"></div>
      <button onClick="{{ handleRemove }}" style="border:none;background:none;text-align:left;cursor:pointer;padding:9px 12px;font-size:12.5px;color:var(--color-accent-700);display:flex;align-items:center;gap:8px;font-family:var(--font-body)" style-hover="background:var(--color-accent-100)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        Remove post
      </button>
    </div>
  </sc-if>

  <div style="{{ post.bodyStyle }}">
    <div style="display:flex;align-items:center;gap:6px;min-width:0">
      <span style="font-family:var(--font-heading);font-weight:800;font-size:10px;letter-spacing:.1em;color:var(--color-neutral-600);flex:none">{{ post.indexLabel }}</span>
      <span class="tag tag-neutral" style="flex:none">{{ post.platformLabel }}</span>
      <span class="text-muted" style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ post.sourceName }}</span>
    </div>
    <div style="font-size:13.5px;line-height:1.3;text-wrap:pretty">{{ post.caption }}</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap">
      <sc-for list="{{ post.tags }}" as="t" hint-placeholder-count="0">
        <span class="tag tag-outline">{{ t }}</span>
      </sc-for>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding-top:6px;border-top:2px solid var(--color-divider);margin-top:2px">
      <div style="display:flex">{{ saverNodes }}</div>
      <span class="text-muted" style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ post.saverLabel }}</span>
      <span style="margin-left:auto;display:flex;align-items:center;gap:4px;font-size:11px;color:var(--color-neutral-600);flex:none">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 011 1v17l-7-4-7 4V4a1 1 0 011-1z"/></svg>
        {{ post.saves }}
      </span>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:280,&quot;height&quot;:340}}">
class Component extends DCLogic {
  state = { menuOpen:false };
  toggleMenu = (e) => { e.stopPropagation(); this.setState(s => ({ menuOpen: !s.menuOpen })); };
  stopMenuClick = (e) => e.stopPropagation();
  handleCopyLink = (e) => { e.stopPropagation(); this.setState({ menuOpen:false }); };
  handleSelect = (e) => {
    e.stopPropagation();
    const p = this.props.post;
    if (p && p.toggleSelect) p.toggleSelect();
  };
  handleRemove = (e) => {
    e.stopPropagation();
    this.setState({ menuOpen:false });
    const p = this.props.post;
    if (p && p.remove) p.remove();
  };
  renderVals() {
    const p = this.props.post || {};
    const savers = p.savers || [];
    return {
      imgNode: p.img ? React.createElement('img', {
        src: p.img, className: 'grayscale',
        style: { position:'absolute', inset:0, width:'100%', height:'100%', objectFit:'cover' },
      }) : null,
      saverNodes: savers.slice(0,3).map((initial, i) => React.createElement('span', {
        key: i,
        style: {
          width:20, height:20, flex:'none', marginLeft: i ? -6 : 0,
          background:'var(--color-neutral-300)', border:'2px solid var(--color-surface)',
          display:'flex', alignItems:'center', justifyContent:'center',
          fontFamily:'var(--font-heading)', fontWeight:800, fontSize:9,
          color:'var(--color-neutral-800)', position:'relative', zIndex: 3 - i,
        },
      }, initial)),
      menuOpen: this.state.menuOpen,
      toggleMenu: this.toggleMenu,
      stopMenuClick: this.stopMenuClick,
      handleCopyLink: this.handleCopyLink,
      handleSelect: this.handleSelect,
      handleRemove: this.handleRemove,
    };
  }
}

</script>
</body>
</html>
